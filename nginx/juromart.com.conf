# ==============================================================================
# NGINX High-Performance Configuration for JuroMart (juromart.com)
# Hosted at NovaHost Kenya (https://novahost.co.ke/)
# ==============================================================================

# 1. Upstream Service Definitions with Persistent HTTP Keep-Alive
upstream juromart_frontend {
    server 127.0.0.1:3004;
    keepalive 64;
}

upstream juromart_backend {
    server 127.0.0.1:9000;
    keepalive 64;
}

upstream juromart_websocket {
    server 127.0.0.1:8000;
    keepalive 32;
}

# 2. Rate Limiting Zones (DDoS / Brute Force Mitigation)
limit_req_zone $binary_remote_addr zone=juromart_general:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=juromart_checkout:10m rate=8r/s;

# ------------------------------------------------------------------------------
# Server Block: HTTP -> HTTPS Redirection (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name juromart.com www.juromart.com api.juromart.com;

    # Let's Encrypt / Certbot Domain Verification Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to Secure HTTPS
    location / {
        return 301 https://juromart.com$request_uri;
    }
}

# ------------------------------------------------------------------------------
# Server Block: WWW to Apex Redirect (HTTPS)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.juromart.com;

    ssl_certificate /etc/letsencrypt/live/juromart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juromart.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://juromart.com$request_uri;
}

# ------------------------------------------------------------------------------
# Server Block: Dedicated API Subdomain (api.juromart.com)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.juromart.com;

    ssl_certificate /etc/letsencrypt/live/juromart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juromart.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 25M;

    # Safaricom M-Pesa STK & Callback Rate Limiting
    location /api/payments/ {
        limit_req zone=juromart_checkout burst=10 nodelay;
        proxy_pass http://juromart_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Africa's Talking / Logistics Dispatch
    location / {
        limit_req zone=juromart_general burst=30 nodelay;
        proxy_pass http://juromart_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# Server Block: Primary Storefront & Unified Reverse Proxy (juromart.com)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name juromart.com;

    # SSL TLS Configuration (Let's Encrypt / NovaHost AutoSSL)
    ssl_certificate /etc/letsencrypt/live/juromart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juromart.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Security & Privacy Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Compression Tuning for Kenyan Low-Bandwidth / 4G Connections
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    client_max_body_size 25M;

    # Static Next.js Bundles: Long-term Immutable Caching (1 Year)
    location /_next/static/ {
        alias /var/www/juromart/apps/web/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Static Assets (PWA Icons, manifest, robots, sitemap)
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
        root /var/www/juromart/apps/web/public;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @nextjs;
    }

    # Real-Time WebSocket Notification Hub (/ws/)
    location /ws/ {
        proxy_pass http://juromart_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Single-Domain API Route Proxy (/api/) -> Backend Express Port 9000
    location /api/ {
        limit_req zone=juromart_general burst=20 nodelay;
        proxy_pass http://juromart_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Storefront Fallback -> Standalone Next.js Node.js Server Port 3004
    location / {
        limit_req zone=juromart_general burst=30 nodelay;
        try_files $uri @nextjs;
    }

    location @nextjs {
        proxy_pass http://juromart_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
