version: '3.8'

# ==============================================================================
# JuroMart Production Docker Compose Stack (juromart.com)
# Hosted at NovaHost Kenya (https://novahost.co.ke/)
# ==============================================================================

services:
  # 1. High-Performance Redis Store for Caching & Task Queues
  redis:
    image: redis:7-alpine
    container_name: juromart_redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - juromart_net
    deploy:
      resources:
        limits:
          memory: 256M

  # 2. Meilisearch Faceted Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: juromart_meilisearch
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-juromart_meili_secret_2026}
      MEILI_ENV: production
    volumes:
      - meili_prod_data:/meili_data
    networks:
      - juromart_net
    deploy:
      resources:
        limits:
          memory: 384M

  # 3. JuroMart Backend API Service (Express / Medusa)
  backend:
    build:
      context: ../..
      dockerfile: tooling/docker/Dockerfile.backend
    container_name: juromart_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 9000
      CORS_ALLOWED_ORIGINS: "https://juromart.com,https://www.juromart.com,https://api.juromart.com,https://seller.juromart.com"
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_POOLED: ${DATABASE_URL_POOLED}
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:-juromart_meili_secret_2026}
      DARARA_CONSUMER_KEY: ${DARARA_CONSUMER_KEY}
      DARARA_CONSUMER_SECRET: ${DARARA_CONSUMER_SECRET}
      DARARA_PASSKEY: ${DARARA_PASSKEY}
      DARARA_SHORTCODE: ${DARARA_SHORTCODE:-174379}
      AT_API_KEY: ${AT_API_KEY}
      AT_USERNAME: ${AT_USERNAME}
    depends_on:
      - redis
      - meilisearch
    networks:
      - juromart_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 4. JuroMart Frontend Web Service (Next.js Standalone)
  web:
    build:
      context: ../..
      dockerfile: tooling/docker/Dockerfile.web
    container_name: juromart_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3004
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_SITE_URL: "https://juromart.com"
      NEXT_PUBLIC_API_URL: "https://api.juromart.com"
      NEXT_PUBLIC_WS_URL: "wss://juromart.com/ws/notifications"
      BACKEND_INTERNAL_URL: "http://backend:9000"
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REVALIDATION_SECRET_TOKEN: ${REVALIDATION_SECRET_TOKEN:-juromart_reval_token_99x}
    depends_on:
      - backend
    networks:
      - juromart_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3004/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 5. Production Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: juromart_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../nginx/juromart.com.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../nginx/ssl-params.conf:/etc/nginx/snippets/ssl-params.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_challenge:/var/www/certbot:ro
    depends_on:
      - web
      - backend
    networks:
      - juromart_net

volumes:
  redis_prod_data:
  meili_prod_data:
  certbot_certs:
  certbot_challenge:

networks:
  juromart_net:
    driver: bridge
