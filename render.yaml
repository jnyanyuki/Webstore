services:
  # 1. Express Backend Web Service on Render
  - type: web
    name: juromart-backend
    env: docker
    dockerfilePath: tooling/docker/Dockerfile.backend
    context: .
    plan: starter
    region: frankfurt
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "9000"
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://juromart.com,https://www.juromart.com,https://seller.juromart.com,https://api.juromart.com"
      - key: COOKIE_DOMAIN
        value: ".juromart.com"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_POOLED
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: "neondb"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PGBOUNCER
        value: "true"
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-central-1
      - key: S3_BUCKET
        value: uploads
      - key: NEON_AUTH_URL
        sync: false
      - key: NEON_JWKS_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MEILISEARCH_HOST
        sync: false
      - key: MEILISEARCH_KEY
        sync: false
      - key: DARARA_CONSUMER_KEY
        sync: false
      - key: DARARA_CONSUMER_SECRET
        sync: false
      - key: DARARA_PASSKEY
        sync: false
      - key: DARARA_SHORTCODE
        value: "174379"
      - key: MPESA_CALLBACK_URL
        value: "https://api.juromart.com/api/payments/mpesa/callback"
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: SENTRY_DSN
        sync: false
