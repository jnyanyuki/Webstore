---
# ==============================================================================
# cPanel Git™ Automated Deployment Configuration for JuroMart (juromart.com)
# ==============================================================================
deployment:
  tasks:
    # 1. Set environment paths
    - export NODE_ENV=production
    - export DEPLOY_DIR=$(pwd)
    
    # 2. Synchronize dependencies and generate Prisma client
    - npm install --prefer-offline --no-audit
    - npx prisma generate --schema=apps/web/prisma/schema.prisma
    
    # 3. Build Turbopack production bundles
    - npm run build
    
    # 4. Synchronize Next.js Standalone assets
    - mkdir -p apps/web/.next/standalone/apps/web/.next
    - mkdir -p apps/web/.next/standalone/apps/web/public
    - cp -rf apps/web/public/* apps/web/.next/standalone/apps/web/public/ 2>/dev/null || true
    - cp -rf apps/web/.next/static apps/web/.next/standalone/apps/web/.next/ 2>/dev/null || true
    
    # 5. Trigger zero-downtime Phusion Passenger restart in cPanel
    - mkdir -p apps/web/tmp
    - touch apps/web/tmp/restart.txt
    - mkdir -p apps/backend/tmp
    - touch apps/backend/tmp/restart.txt
