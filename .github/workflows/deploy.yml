name: JuroMart Production CI/CD (NovaHost Kenya)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  deploy:
    name: Automatic Pull & Deploy on NovaHost
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Trigger Automatic Git Pull & Deploy on NovaHost
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NOVAHOST_SSH_HOST || '213.139.204.9' }}
          username: ${{ secrets.NOVAHOST_SSH_USER || 'juromart' }}
          password: ${{ secrets.NOVAHOST_SSH_PASSWORD }}
          port: ${{ secrets.NOVAHOST_SSH_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            echo "=========================================================="
            echo "🚀 NovaHost Kenya Automatic Pull & Production Deployment"
            echo "Target: juromart.com (213.139.204.9)"
            echo "=========================================================="
            
            # Navigate to the repository directory
            if [ -d "/home/juromart/Webstore" ]; then
              cd /home/juromart/Webstore
            elif [ -d "$HOME/Webstore" ]; then
              cd "$HOME/Webstore"
            else
              echo "Creating or locating Webstore directory in $HOME..."
              cd "$HOME"
            fi
            
            echo "📥 Fetching and pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "⚙️ Executing deployment script..."
            chmod +x deploy-novahost.sh
            ./deploy-novahost.sh
